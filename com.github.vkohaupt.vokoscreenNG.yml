app-id: com.github.vkohaupt.vokoscreenNG
runtime: org.kde.Platform
runtime-version: 6.11
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
command: vokoscreenNG
rename-desktop-file: vokoscreenNG.desktop
rename-appdata-file: vokoscreenNG.appdata.xml
rename-icon: vokoscreenNG
finish-args:
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=home
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/pipewire-0
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=GST_PLUGIN_FEATURE_RANK=openh264dec:MAX

modules:
#   gstreamer-plugins-good wird benötigt da in GStreamer 1.26.10 ximagesrc nicht vorhanden ist
#   Aktuell am 26.10.2026 mit org.kde.platform 6.11 ist Gstreamer 1.16.11
#   Geändert am 26.10.2026 von 1.26.10 zu 1.26.11
  - name: gstreamer-plugins-good
    buildsystem: meson
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.26.11.tar.xz
        sha256: 001deb0876d5d743cd3448abf74a27adec3fd850012fcb1b00994861bd6c1145

#   Für das kompilieren von gstreamer-plugins-bad wird als runtime der openh264 codec benötigt
  - name: openh264
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/cisco/openh264.git
        tag: 2.5.1
        commit: e79561922cc82bf968a4fb8e9aa8fc33e37c1bce
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

#   gstreamer-plugins-bad beinhaltet openh264enc
#   Geändert am 26.10.2026 von 1.26.10 zu 1.26.11
  - name: gstreamer-plugins-bad
    buildsystem: meson
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.26.11.tar.xz
        sha256: 110fb82795f0e569b1e27b12ab9699d35c7762e1ff4db95335d6ac8d1442af3d

  - name: vokoscreenNG
    buildsystem: qmake
    subdir: src
    build-options:
      env:
        QMAKEPATH: /app # WICHTIG: qmake Basis-Pfad setzen
    config-opts:
      - QMAKE_INCDIR+=/app/include/QtWebEngine # Header-Pfade hinzufügen
      - QMAKE_INCDIR+=/app/include/QtWebEngineCore
      - QMAKE_INCDIR+=/app/include/QtWebEngineWidgets
    post-install:
      - install -Dm755 vokoscreenNG ${FLATPAK_DEST}/bin/vokoscreenNG
      - install -Dm644 applications/vokoscreenNG.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/vokoscreenNG.png
      - install -Dm644 applications/vokoscreenNG.desktop ${FLATPAK_DEST}/share/applications/vokoscreenNG.desktop
      - install -Dm644 ../vokoscreenNG.appdata.xml ${FLATPAK_DEST}/share/metainfo/vokoscreenNG.appdata.xml
    sources:
      - type: git
        url: https://github.com/vkohaupt/vokoscreenNG.git
        tag: 4.11.0
        commit: 2f1c860425f1c92e2f2a358cfc9517240808f96a
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
      - type: file
        path: vokoscreenNG.appdata.xml
